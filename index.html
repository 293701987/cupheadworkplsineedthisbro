<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <base href="https://cdn.jsdelivr.net/gh/web-ports/cuphead@c9ff1b6b16f9d402b78a42fc2200e1c076c0ab6e/">
    <style>
      body { background-color: black; margin: 0; padding: 0; overflow: hidden; }
      #gameContainer { width: 100vw !important; height: 100vh !important; }
      canvas { width: 100% !important; height: 100% !important; }
      #loading-text {
        color: #fff; font-size: 40px; font-family: cursive; text-align: center; margin: 20px 12px 0;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="loading-text">LOADING...</div>
    <div id="gameContainer"></div>
    <script src="Build/UnityLoader.js"></script>
    <script>
      var loadingText = document.querySelector("#loading-text");
      let loadedBytes = 0;
      const TOTAL_MB = 2101.31;
      const PARALLEL = 3; /* how many pieces download at once (was ~108 at once) */

      function showProgress() {
        loadingText.textContent = "LOADING... " + (loadedBytes / 1048576).toFixed(2) + " MB / " + TOTAL_MB + " MB";
      }

      /* Downloads one piece, retries up to 3 times, returns a Blob (kept out of memory by the browser) */
      async function fetchPart(url) {
        for (let attempt = 1; attempt <= 3; attempt++) {
          let got = 0;
          try {
            const res = await fetch(url);
            if (!res.ok) throw new Error("HTTP " + res.status);
            const reader = res.body.getReader();
            const chunks = [];
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              got += value.length;
              loadedBytes += value.length;
              chunks.push(value);
              showProgress();
            }
            return new Blob(chunks);
          } catch (e) {
            loadedBytes -= got;
            if (attempt === 3) throw new Error(url + " failed (" + e.message + ")");
            await new Promise(r => setTimeout(r, 1000 * attempt));
          }
        }
      }

      async function fetchAll(parts) {
        const results = new Array(parts.length);
        let next = 0;
        async function worker() {
          while (next < parts.length) {
            const i = next++;
            results[i] = await fetchPart(parts[i]);
          }
        }
        await Promise.all(Array.from({ length: PARALLEL }, worker));
        return results;
      }

      async function mergeFiles(fileParts, cacheKey) {
        let cache = null;
        try { if (window.caches) cache = await caches.open("cuphead-cache"); } catch (e) { cache = null; }
        if (cache) {
          try {
            const hit = await cache.match(cacheKey);
            if (hit) return URL.createObjectURL(await hit.blob());
          } catch (e) {}
        }
        const blobs = await fetchAll(fileParts);
        const merged = new Blob(blobs);
        if (cache) {
          try { await cache.put(cacheKey, new Response(merged)); } catch (e) { /* storage full: keep going without saving */ }
        }
        return URL.createObjectURL(merged);
      }

      function getParts(file, start, end) {
        const parts = [];
        for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
        return parts;
      }

      (async () => {
        try {
          const dataUrl = await mergeFiles(getParts("Build/CupheadPort.data.unityweb", 1, 103), "CupheadPort.data.unityweb");
          const wasmUrl = await mergeFiles(getParts("Build/CupheadPort.wasm.code.unityweb", 1, 2), "CupheadPort.wasm.code.unityweb");
          const asmUrl  = await mergeFiles(getParts("Build/CupheadPort.asm.code.unityweb", 1, 3), "CupheadPort.asm.code.unityweb");

          const originalOpen = XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open = function (method, url, ...rest) {
            if (url.includes("CupheadPort.data.unityweb")) url = dataUrl;
            else if (url.includes("CupheadPort.wasm.code.unityweb")) url = wasmUrl;
            else if (url.includes("CupheadPort.asm.code.unityweb")) url = asmUrl;
            return originalOpen.call(this, method, url, ...rest);
          };
          UnityLoader.instantiate("gameContainer", "Build/CupheadPort.json");
          loadingText.remove();
        } catch (e) {
          loadingText.style.fontSize = "20px";
          loadingText.textContent = "Loading failed: " + e.message + " (reload to retry)";
        }
      })();
    </script>
  </body>
</html>
